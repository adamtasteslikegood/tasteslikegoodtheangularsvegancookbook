# PR Gate — quality checks that must pass before any dev→main merge.
#
# All jobs are required status checks (configure in GitHub branch protection).
# The 'gate' job is the single required check: it passes only when all
# individual jobs succeed, so branch protection only needs one rule.
#
# KAN-26, KAN-27, KAN-33

name: PR Gate

on:
  pull_request:
    branches: [main, dev, 'dev/**']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────

  frontend-lint:
    name: Frontend — lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  frontend-type-check:
    name: Frontend — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p server/tsconfig.server.json

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: |
            dist/
            server/dist/
          retention-days: 3

  frontend-test:
    name: Frontend — unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Coverage thresholds are enforced by vitest.config.ts:
      #   lines/stmts ≥ 60%, branches ≥ 50%, functions ≥ 40%
      - run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  # ── Backend ───────────────────────────────────────────────────────────────

  backend-test:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        working-directory: Backend
        run: uv sync
      - name: Run pytest
        working-directory: Backend
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: uv run pytest

  # Branched Alembic heads make `flask db upgrade` refuse to run, which fails
  # the flask-backend-migrate Cloud Run Job and aborts the deploy mid-release.
  # This ran only on release-train.yml's manual dispatch and daily cron, so a
  # pointer bump onto a two-head Backend could merge clean and surface hours
  # later. It is a required check now: same script train-verify.sh station 4
  # calls, so the gate and the release train cannot disagree.
  alembic-heads:
    name: Backend — single Alembic head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify exactly one Alembic head
        run: ./scripts/release/alembic-heads.sh --check

  # ── Submodule sync ────────────────────────────────────────────────────────
  # Guards against the two ways the Backend submodule pointer goes wrong:
  #   1. Backend main/dev diverge (back-sync owed) — "divergence" mode
  #   2. Parent gitlink points at a SHA unreachable from the target branch —
  #      "gitlink" mode, checking against the PR's base_ref
  #
  # Scoped to dev-targeting PRs only. Main-targeting PRs are already gated by
  # release-train (train-verify.sh --for-release), which checks the pointer is
  # on Backend main (Station 3/4). Duplicating that here would either disagree
  # or be redundant — both bad.

  submodule-sync:
    name: Backend — submodule sync
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Fetch full refs for both repos
        run: |
          git config --unset-all remote.origin.fetch || true
          git config --add remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin --prune
          git -C Backend fetch origin --prune
      - name: Check Backend main/dev divergence
        working-directory: Backend
        run: bash ../scripts/git/check-submodule-sync.sh divergence
      - name: Check gitlink reachability
        run: bash scripts/git/check-submodule-sync.sh gitlink Backend ${{ github.base_ref }}

  # ── Docker ────────────────────────────────────────────────────────────────
  # Builds the production Express image (no push, no credentials). Catches
  # Dockerfile/lockfile breakage before a release tag hands it to Cloud Build
  # (the v0.3.4 failure mode). Flask image is owned by Backend CI (D2).

  docker-build:
    name: Docker — Express image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile .

  # ── Cloud Build config ────────────────────────────────────────────────────
  # YAML parsing alone does not validate shell embedded in block scalars.

  cloudbuild-config:
    name: Cloud Build — config syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate YAML and embedded bash
        run: ruby scripts/gcloud/validate_cloudbuild_shell.rb cloudbuild.yaml cloudbuild.staging.yaml

  # ── Changelog ─────────────────────────────────────────────────────────────

  changelog-check:
    name: CHANGELOG entry for this version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify CHANGELOG.md has an entry for package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking CHANGELOG.md for version: $VERSION"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing. Add it before merging to main."
            exit 1
          fi
          if ! grep -qF "## [$VERSION]" CHANGELOG.md && ! grep -qF "## $VERSION" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for v$VERSION. Add a '## [$VERSION]' section."
            exit 1
          fi
          echo "✅ CHANGELOG.md has an entry for v$VERSION"

  # ── SEO ───────────────────────────────────────────────────────────────────

  canonical-recipes:
    name: SEO — canonical recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/seo/check_canonical_recipes.sh

  # Guards the guard (KAN-173). The live posture check runs on a schedule with
  # GCP credentials; this job runs its --self-test, which needs neither, and
  # fails if the check can no longer detect the KAN-170 exposure. Without it a
  # broken detector reads exactly like a clean production posture.
  posture-check-self-test:
    name: Security — posture check can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/gcloud/kan170_verify.sh --self-test

  # Release-train stations, on main-targeting PRs ONLY (KAN-191).
  #
  # train-verify.sh has existed since KAN-138 and correctly exits 1 on blocking
  # drift — but release-train.yml runs it on workflow_dispatch and a daily cron,
  # so nothing ever merged on its result. v0.4.8 shipped a pointer that Station 3
  # blocked; it was corrected because a human read the output, not because CI
  # stopped the merge. This job is what makes the station a gate.
  #
  # dev-targeting PRs skip it deliberately: a lagging pointer and an unpaid
  # back-sync are normal mid-cycle states, and blocking them would train people
  # to ignore this check. `gate` treats `skipped` as passing.
  release-train:
    name: Release train — verify stations
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # checkout fetches only the PR ref; the stations compare origin/dev against
      # origin/main in BOTH repos, so those remote-tracking refs must exist.
      # Without this the script dies at exit 2 ("could not determine") rather
      # than passing — the right failure, but a useless one.
      - name: Fetch full refs for both repos
        run: |
          git config --unset-all remote.origin.fetch || true
          git config --add remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin --prune --tags
          git -C Backend fetch origin --prune
      # --no-fetch because the step above already did it; --for-release still
      # queries origin for the tag regardless, which is the one lookup that must
      # not be guessed.
      #
      # This exact checkout+fetch pair is proven, not assumed: release-train.yml
      # runs it daily, and run 30557811029 (2026-07-30) exited 1 with
      # "BLOCK Backend main→dev back-sync owed" — i.e. it resolved refs in BOTH
      # repos and failed for the reason the check exists, rather than dying at
      # exit 2 on its own plumbing.
      - name: Verify release-train stations
        run: ./scripts/release/train-verify.sh --for-release --no-fetch

  # ── Sprint lane ───────────────────────────────────────────────────────────
  # Sprint 4 retrospective action: make check_sprint_lane.sh a blocking gate rather
  # than a script run on demand. Success measure from the retro, verbatim: "a PR
  # orphaning a sprint-N row fails CI". Adding it to `gate.needs` below is what makes
  # that true — `gate` is the required status check, so nothing in branch protection
  # needs to change.
  #
  # Risk R1/R2 across Sprint 3-5: the KAN/RCP lane collapsed once because the split
  # was a convention nobody asserted. The script has held it for a full sprint; this
  # is what stops it depending on someone remembering to run it.
  #
  # SCOPE: it asserts the NEWEST `sprint-N` label in KAN — the current sprint — because
  # that is what check_sprint_lane.sh defaults to when given no argument. An orphan on
  # an older, superseded sprint label does not fail CI. That is the intended scope (a
  # closed sprint's rows are Done and filtered out anyway), but the retro's phrasing
  # "a PR orphaning a sprint-N row fails CI" is broader than what this enforces, so the
  # narrower truth is written here rather than left to be discovered.
  #
  # SKIPPED in two cases, both of which `gate` counts as passing:
  #   1. Fork PRs — repository secrets are unavailable, so the Jira query is impossible.
  #   2. Dependabot PRs — these are NOT forks. They are same-repo branches
  #      (`dependabot/...`, head owner == this repo), so the fork test above does not
  #      catch them, but Actions secrets are still withheld from them by default.
  #      Without the explicit actor test this job would run, exit 2, and block EVERY
  #      dependency update. Caught in review on PR #3336 before it could do that.
  # A fork or Dependabot PR is therefore not lane-checked. Neither touches sprint labels.
  #
  # It does NOT skip merely because the secrets are unset on an ordinary same-repo PR.
  # That case exits 2 and fails, because a gate that silently passes when it cannot run
  # is worse than no gate — it is the failure mode this whole job exists to correct.
  sprint-lane:
    name: Sprint lane — KAN/RCP link
    # Both Dependabot tests are kept deliberately, not redundantly. `github.actor` is
    # the actor of the *triggering event* — on a manual re-run it becomes the human who
    # pressed the button, so that test alone can let a re-run of a Dependabot PR through.
    # `pull_request.user.login` is the PR author and never changes. Either one is enough
    # for the ordinary case; together they hold for re-runs too. The failure mode being
    # guarded is "every dependency update is blocked", which earns the belt and braces.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # No .env in CI — the script reads these from the environment instead, and
      # exits 2 (not 0) if they are missing.
      - name: Assert the KAN/RCP sprint lane
        run: bash scripts/pm/check_sprint_lane.sh

  # ── Gate ──────────────────────────────────────────────────────────────────
  # Single required check for branch protection. Fails if ANY job above fails.

  gate:
    name: Gate — all checks passed
    needs:
      - frontend-lint
      - frontend-type-check
      - frontend-build
      - frontend-test
      - backend-test
      - alembic-heads
      - submodule-sync
      - docker-build
      - cloudbuild-config
      - changelog-check
      - canonical-recipes
      - posture-check-self-test
      - release-train
      - sprint-lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate all job results
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          failed = [name for name, info in data.items() if info.get('result') not in ('success', 'skipped')]
          print('\n'.join(failed))
          ")
          if [ -n "$failed" ]; then
            echo "::error::The following jobs failed or were cancelled:"
            echo "$failed"
            exit 1
          fi
          echo "✅ All PR gate checks passed."
