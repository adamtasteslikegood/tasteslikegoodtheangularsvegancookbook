# KAN-97 / RCP-39: auto-transition Jira issues to Done when a PR merges.
#
# Extracts KAN-### and RCP-### keys from the PR title and transitions any
# that are in "To Do" or "In Progress" to "Done". Keys not in KAN/RCP are
# ignored (the PM allowlist is KAN + RCP for writes).
#
# Replaces the manual post-merge board update that was missed on six
# consecutive PRs (Sprint 6 D2).

name: Jira Auto-Transition

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

permissions:
  contents: read

jobs:
  transition:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Transition Jira issues to Done
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          SITE="tasteslikegood.atlassian.net"

          # Extract KAN-### and RCP-### from the PR title
          KEYS=$(echo "$PR_TITLE" | grep -oE '(KAN|RCP)-[0-9]+' | sort -u || true)

          if [ -z "$KEYS" ]; then
            echo "No KAN/RCP keys in PR title — nothing to transition."
            exit 0
          fi

          for KEY in $KEYS; do
            echo "::group::$KEY"

            # Fetch current status
            STATUS=$(curl -sf -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              "https://$SITE/rest/api/3/issue/$KEY?fields=status" \
              | jq -r '.fields.status.name' 2>/dev/null || echo "UNKNOWN")

            if [ "$STATUS" = "Done" ]; then
              echo "$KEY is already Done — skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "$STATUS" != "To Do" ] && [ "$STATUS" != "In Progress" ] && [ "$STATUS" != "In Review" ]; then
              echo "$KEY is in '$STATUS' — not a transitionable state, skipping."
              echo "::endgroup::"
              continue
            fi

            # Get available transitions and find "Done"
            DONE_ID=$(curl -sf -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              "https://$SITE/rest/api/3/issue/$KEY/transitions" \
              | jq -r '.transitions[] | select(.name == "Done") | .id' 2>/dev/null || true)

            if [ -z "$DONE_ID" ]; then
              echo "::warning::$KEY: no 'Done' transition available from '$STATUS'."
              echo "::endgroup::"
              continue
            fi

            # Transition to Done
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              -X POST \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$DONE_ID\"}}" \
              "https://$SITE/rest/api/3/issue/$KEY/transitions")

            if [ "$HTTP_CODE" = "204" ]; then
              echo "✓ $KEY: $STATUS → Done (PR #$PR_NUMBER)"
            else
              echo "::warning::$KEY: transition returned HTTP $HTTP_CODE"
            fi

            echo "::endgroup::"
          done
