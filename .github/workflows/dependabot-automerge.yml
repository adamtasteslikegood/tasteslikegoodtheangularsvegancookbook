name: Automerge Dependabot (patch/minor)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only run for Dependabot PRs
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice::Major update detected (${{ steps.metadata.outputs.update-type }}). Not auto-merging."
          exit 0

      - name: Approve patch/minor updates
        # Note: GITHUB_TOKEN approval may not satisfy branch protection rules that
        # require reviews from specific users/teams. A PAT from a dedicated bot
        # account would be needed in that case.
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: Dependabot ${{ steps.metadata.outputs.update-type }} update."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Squash is blocked on dev by ruleset (GitHub rejects it with "Merge
      # method squash merging is not allowed on this repository"), so pick per
      # PR: a single-commit bump rebases cleanly and keeps history linear; a
      # multi-commit PR gets a merge commit so its ancestry survives. If the
      # ruleset rejects the first choice, fall back to the other rather than
      # leaving the PR unmerged.
      - name: Enable auto-merge (rebase or merge)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.data.draft) {
              core.info("PR is draft; not enabling auto-merge.");
              return;
            }

            core.info(`Dependabot update-type: ${{ steps.metadata.outputs.update-type }}`);

            const commits = pr.data.commits;
            const order = commits === 1 ? ["REBASE", "MERGE"] : ["MERGE", "REBASE"];
            const failures = [];
            for (const mergeMethod of order) {
              try {
                await github.graphql(`
                  mutation($pullRequestId:ID!, $mergeMethod:PullRequestMergeMethod!) {
                    enablePullRequestAutoMerge(input:{
                      pullRequestId:$pullRequestId,
                      mergeMethod:$mergeMethod
                    }) { pullRequest { number } }
                  }`,
                  { pullRequestId: pr.data.node_id, mergeMethod }
                );
                core.info(`Enabled auto-merge (${mergeMethod.toLowerCase()}) for PR #${pull_number} (${commits} commit${commits === 1 ? "" : "s"}).`);
                return;
              } catch (err) {
                const reason = err instanceof Error ? err.message : String(err);
                failures.push(`${mergeMethod}: ${reason}`);
                core.warning(`Auto-merge with ${mergeMethod} rejected; trying the next method.`);
              }
            }
            core.setFailed(`Could not enable auto-merge with any allowed method:\n${failures.join("\n")}`);
