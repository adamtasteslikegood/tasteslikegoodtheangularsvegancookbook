# KAN-97 / RCP-39: auto-transition Jira issues to Done when a PR merges.
#
# Extracts KAN-### and RCP-### keys from the PR title. KAN issues in "To Do",
# "In Progress", or "In Review" are transitioned to "Done". RCP keys are
# epic/delivery-level (see root CLAUDE.md) and typically span multiple PRs,
# so they are logged but never auto-transitioned — closing an RCP epic stays
# a manual, deliberate call.
#
# Replaces the manual post-merge board update that was missed on six
# consecutive PRs (Sprint 6 D2).

name: Jira Auto-Transition

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

permissions:
  contents: read

jobs:
  transition:
    # Same-repo only (forks have no secrets → skip cleanly), consistent with
    # the guard in run-prettier-formatting-with-reviewdog.yml and pr-gate.yml.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transition Jira issues to Done
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          SITE="tasteslikegood.atlassian.net"

          # Extract KAN-### and RCP-### from the PR title. Word-boundary
          # anchored so e.g. "ORPHKAN-12" or "MYRCP-7" don't false-match.
          KEYS=$(echo "$PR_TITLE" | grep -oE '\b(KAN|RCP)-[0-9]+\b' | sort -u || true)

          if [ -z "$KEYS" ]; then
            echo "No KAN/RCP keys in PR title — nothing to transition."
            exit 0
          fi

          for KEY in $KEYS; do
            echo "::group::$KEY"

            if [[ "$KEY" == RCP-* ]]; then
              echo "$KEY is an RCP epic/delivery key — skipping auto-transition (manual closure only)."
              echo "::endgroup::"
              continue
            fi

            # Fetch current status
            STATUS_JSON=$(curl -sf -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              "https://$SITE/rest/api/3/issue/$KEY?fields=status") || STATUS_JSON=""

            if [ -z "$STATUS_JSON" ]; then
              echo "::warning::$KEY: failed to fetch issue status from Jira (bad key, auth, or API outage)."
              echo "::endgroup::"
              continue
            fi

            STATUS=$(echo "$STATUS_JSON" | jq -r '.fields.status.name' 2>/dev/null || echo "UNKNOWN")

            if [ "$STATUS" = "Done" ]; then
              echo "$KEY is already Done — skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "$STATUS" != "To Do" ] && [ "$STATUS" != "In Progress" ] && [ "$STATUS" != "In Review" ]; then
              echo "$KEY is in '$STATUS' — not a transitionable state, skipping."
              echo "::endgroup::"
              continue
            fi

            # Get available transitions and find "Done"
            TRANSITIONS_JSON=$(curl -sf -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              "https://$SITE/rest/api/3/issue/$KEY/transitions") || TRANSITIONS_JSON=""

            if [ -z "$TRANSITIONS_JSON" ]; then
              echo "::warning::$KEY: failed to fetch available transitions from Jira (auth or API outage)."
              echo "::endgroup::"
              continue
            fi

            DONE_ID=$(echo "$TRANSITIONS_JSON" | jq -r '.transitions[] | select(.name == "Done") | .id' 2>/dev/null || true)

            if [ -z "$DONE_ID" ]; then
              echo "::warning::$KEY: no 'Done' transition available from '$STATUS'."
              echo "::endgroup::"
              continue
            fi

            # Transition to Done
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              -X POST \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$DONE_ID\"}}" \
              "https://$SITE/rest/api/3/issue/$KEY/transitions")

            if [ "$HTTP_CODE" = "204" ]; then
              echo "✓ $KEY: $STATUS → Done (PR #$PR_NUMBER)"
            else
              echo "::warning::$KEY: transition returned HTTP $HTTP_CODE"
            fi

            echo "::endgroup::"
          done
