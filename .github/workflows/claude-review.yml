# Independent Claude review — advisory, cost-optimized, fail-open.
#
# Runs a SECOND, INDEPENDENT review of a PR in its own CI session, on a DIFFERENT
# and CHEAPER model than the authoring session (author works in Opus 4.8 / Fable 5;
# this reviewer uses an Opus 4.x < 4.8). It reasons about scope, picks the review
# skill + reasoning effort, applies fixes, and leaves a comment per fix.
#
# ADVISORY ONLY — never a required status check (see docs/ci/refresh/SPEC-02 §3 and
# SPEC-03). `continue-on-error: true` so a flaky/absent key never blocks a merge,
# and the review step is SKIPPED entirely when no Claude credential is configured.
#
# AUTH: a Claude Pro/Max subscription OAuth token only.
#   * CLAUDE_CODE_OAUTH_TOKEN — long-lived token from `claude setup-token`; draws on
#     your subscription's usage/rate limits.
#   * ANTHROPIC_API_KEY is deliberately NOT used here (Adam, 2026-10-20): that secret
#     exists for the gh-aw threat detection (KAN-445) and is metered API billing, so
#     this review never falls back to it.
# `id-token: write` (below) is required so the action can mint the official Claude
# GitHub App token via OIDC to post comments / push fixes — it is GitHub-side auth,
# independent of which Claude credential you use.
#
# PREREQUISITES (one-time, by a maintainer):
#   1. Add the CLAUDE_CODE_OAUTH_TOKEN secret (Settings → Secrets → Actions).
#      Without it, the review step skips cleanly (advisory, no failure).
#   2. (recommended) Add repo variable  CLAUDE_REVIEW_MODEL  = the exact Opus 4.x<8
#      model id you want (verify at console.anthropic.com). Default below is a
#      placeholder — CONFIRM the id before relying on it.
#   3. Create the `claude-review` label (used to request/re-request a review).
#
# Design: docs/ci/refresh/SPEC-03-claude-independent-review.md
#         docs/ci/refresh/diagram-claude-review.md

name: Claude Review (independent model)

on:
  pull_request:
    # Auto on PR open / un-draft AND on every push (`synchronize`) so commits
    # pushed after the first review are reviewed too (TAS-3006 / KAN-183) — the PR
    # lifecycle in CLAUDE.md ("monitor it, answer every comment, loop until
    # merged") depends on the review loop covering later pushes, not just the first.
    # Also on-demand via the `claude-review` label. The bot's own `--fix` pushes do
    # NOT re-trigger (the `if:` guard below skips `github.event.sender.type == 'Bot'`),
    # and `concurrency: cancel-in-progress` collapses rapid pushes to one review.
    types: [opened, ready_for_review, labeled, synchronize]
    branches: [main, dev, 'dev/**']
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true

permissions:
  contents: write # apply + push fixes to the PR branch
  pull-requests: write # post review comments
  issues: write # fallback / summary comment
  id-token: write # OIDC → official Claude GitHub App token (post comments / push fixes)
  actions: read # find the head the last completed review saw (push-delta scope)

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: Independent Claude review
    # Same-repo only (forks/Dependabot have no secrets → skip cleanly), non-bot,
    # non-draft; on `labeled` events only fire for the `claude-review` label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.sender.type != 'Bot' &&
        (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
      )
    runs-on: ubuntu-latest
    continue-on-error: true # advisory — never blocks the merge

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For pull_request events this is the PR branch, so --fix can push back.
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # full history — /code-review --comment needs PR context
          submodules: recursive
          # Leave no GITHUB_TOKEN in the git config (KAN-420). The action sets up its
          # own Claude App token for the push, but checkout v7 keeps this token in an
          # included credentials file that the action's header cleanup misses, so
          # fix pushes went out as GITHUB_TOKEN and their runs waited for approval.
          persist-credentials: false

      - name: Checkout dispatched PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass the untrusted dispatch input via env, never templated into the
          # shell source — otherwise a crafted `pr` value is a command-injection
          # sink (this job has contents/pull-requests/id-token: write).
          PR_NUMBER: ${{ github.event.inputs.pr }}
        # Works without persisted credentials: gh authenticates with GH_TOKEN.
        run: gh pr checkout "$PR_NUMBER"

      - name: Scope the review (whole PR, or the push delta)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # KAN-420: open, ready_for_review, label and dispatch runs review the
          # whole PR. A push (`synchronize`) reviews only what changed since the
          # last COMPLETED review, at low effort. That review's head, not the
          # event's `before`: cancel-in-progress drops the run for an earlier
          # push, and its commits would otherwise never be reviewed. "Completed"
          # means the review STEP succeeded: a run concludes `success` even when
          # that step was skipped (no credential) or errored (continue-on-error).
          # A base that is missing or not an ancestor (a force-push) falls back
          # to the whole PR, and so does a range holding a merge (an update from
          # the base branch), whose diff would carry the base branch's changes.
          MODE=full RANGE="" LAST=""
          if [ "$ACTION" = synchronize ]; then
            for RUN in $(gh run list --workflow claude-review.yml --branch "$HEAD_REF" \
                           --status success --limit 10 --json databaseId \
                           --jq '.[].databaseId' 2>/dev/null); do
              LAST=$(gh run view "$RUN" --json headSha,jobs --jq \
                'if any(.jobs[].steps[]; .name == "Review + fix + comment" and .conclusion == "success")
                 then .headSha else "" end' 2>/dev/null || echo "")
              [ -z "$LAST" ] || break
            done
            BASE_SHA="${LAST:-$BEFORE}"
            if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$AFTER" ] \
               && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$BASE_SHA" "$AFTER" \
               && [ -z "$(git rev-list --merges "$BASE_SHA..$AFTER")" ]; then
              MODE=delta RANGE="$BASE_SHA..$AFTER"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "::notice::Review scope: $MODE $RANGE"

      - name: Pick a cost-optimized, independent review model
        id: pick
        env:
          # Via env, not templated into the shell source (same injection-safety
          # rule as the dispatch input above; a stray quote/backtick in the var
          # value would otherwise break or inject the script).
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
        run: |
          # Deterministic, always-cheaper-than-author selection:
          #   default = highest Opus 4.x below 4.8 (cheaper than Opus 4.8 / Fable 5
          #   AND a different model, for genuinely independent perspective).
          MODEL="${CLAUDE_REVIEW_MODEL:-claude-opus-4-7}"
          case "$MODEL" in
            claude-opus-4-8*|claude-fable-5*)
              echo "::warning::CLAUDE_REVIEW_MODEL=$MODEL is the authoring tier; using claude-opus-4-7 for a cheaper, independent review."
              MODEL="claude-opus-4-7" ;;
          esac
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "::notice::Independent review model: $MODEL"

      - name: Check for a Claude credential
        id: auth
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Advisory workflow: if no credential is configured, skip cleanly instead
          # of failing (forks/Dependabot also land here — they have no secrets).
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "::notice::Authenticating with CLAUDE_CODE_OAUTH_TOKEN (subscription)."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN secret — skipping independent Claude review (advisory)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review + fix + comment
        if: steps.auth.outputs.present == 'true'
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1
        with:
          # Subscription OAuth only: the API key is not passed, so it is never used.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are an INDEPENDENT code reviewer running in CI, on a different and
            cheaper model than the author's session. Review THIS pull request's diff
            against its base branch. Be rigorous but do not fabricate issues.

            SCOPE: `${{ steps.scope.outputs.mode }}` ${{ steps.scope.outputs.range }}
            - `full`: review the whole PR as described below.
            - `delta`: a push triggered this run. Review ONLY the changes in
              `git diff ${{ steps.scope.outputs.range }}` (the commits since the last
              completed review), at effort `low` whatever step 2 would pick, and add
              `/security-review` only if that range itself touches the paths step 2
              lists. Read the rest of the PR for context only: do not comment on, fix
              or re-raise anything outside that range.

            1. Inspect the changed files (diff vs the base branch).
            2. REASON about scope and risk, then CHOOSE:
               - a reasoning effort level for the review — `low` or `medium` for
                 small / low-risk diffs; `high` or `max` for large diffs or changes
                 to core logic, the Express security/proxy/validation layers
                 (server/security.ts, server/proxy.ts, server/validation.ts), auth,
                 Dockerfiles, CI workflows, or dependency manifests.
               - the review skill(s): always run the built-in `/code-review`;
                 ADDITIONALLY run `/security-review` when the diff touches auth,
                 secrets, the security/proxy/validation layers, Dockerfiles, or
                 dependency manifests.
            3. Run the review so it BOTH applies fixes and posts comments, e.g.
               `/code-review <effort> --comment --fix` (substitute the effort you
               chose). `--fix` edits the working tree (this action commits & pushes
               to the PR branch); `--comment` posts each finding as an inline PR
               comment.
            4. Ensure EVERY fix you apply has a corresponding PR comment saying what
               changed and why (inline on the changed line where possible). Finish
               with ONE summary comment listing each fix as a bullet and noting the
               model + effort you used, signed:
               `— Independent Claude review (<model>, effort <level>)`.
            5. If nothing is worth fixing, post a single short "no changes needed"
               comment. This review is ADVISORY — never block the merge.
          claude_args: |
            --model ${{ steps.pick.outputs.model }}
            --max-turns 60
            --dangerously-skip-permissions
